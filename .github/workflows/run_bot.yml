name: Test Run Telegram Bot

on:
  workflow_dispatch: # Actions ট্যাব থেকে ম্যানুয়ালি রান করার জন্য

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }} # GitHub Secret থেকে টোকেন ইনপুট নেবে
      run: python bot.py
